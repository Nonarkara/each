<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#f6f5f2"/>
  <!-- spine -->
  <rect x="385" y="80" width="30" height="280" fill="#191712"/>
  <!-- top cap -->
  <rect x="365" y="60" width="70" height="20" fill="#191712"/>
  <!-- red signal dot -->
  <circle cx="400" cy="40" r="8" fill="#A8322B"/>
  <!-- pillars -->
  <rect x="160" y="110" width="190" height="60" fill="#26243F"/>
  <rect x="160" y="200" width="190" height="60" fill="#26243F"/>
  <rect x="450" y="110" width="190" height="60" fill="#26243F"/>
  <rect x="450" y="200" width="190" height="60" fill="#26243F"/>
  <!-- connectors -->
  <rect x="350" y="135" width="35" height="10" fill="#191712"/>
  <rect x="350" y="225" width="35" height="10" fill="#191712"/>
  <rect x="415" y="135" width="35" height="10" fill="#191712"/>
  <rect x="415" y="225" width="35" height="10" fill="#191712"/>
  <!-- labels -->
  <text x="255" y="149" text-anchor="middle" fill="#f6f5f2" font-family="Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="0.08em">FINANCES</text>
  <text x="255" y="239" text-anchor="middle" fill="#f6f5f2" font-family="Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="0.08em">PEOPLE</text>
  <text x="545" y="149" text-anchor="middle" fill="#f6f5f2" font-family="Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="0.08em">PROJECTS</text>
  <text x="545" y="239" text-anchor="middle" fill="#f6f5f2" font-family="Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="0.08em">ACCOUNTING</text>
  <!-- center label -->
  <text x="400" y="325" text-anchor="middle" fill="#191712" font-family="Inter, sans-serif" font-size="24" font-weight="700" letter-spacing="0.18em">AXIOM</text>
  <text x="400" y="355" text-anchor="middle" fill="#6f6c63" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em">ONE SPINE · FOUR PILLARS</text>
</svg>
